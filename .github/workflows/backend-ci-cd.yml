name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/DiranyAI.slnx

      - name: Run tests
        run: dotnet test backend/DiranyAI.slnx --no-restore

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Login to Azure Container Registry
        run: az acr login --name diranyaicr

      - name: Build backend image
        run: |
          docker build \
            -t diranyaicr.azurecr.io/diranyai-api:${{ github.sha }} \
            -t diranyaicr.azurecr.io/diranyai-api:latest \
            backend/DiranyAI.Api

      - name: Push backend image
        run: |
          docker push diranyaicr.azurecr.io/diranyai-api:${{ github.sha }}
          docker push diranyaicr.azurecr.io/diranyai-api:latest
          
      - name: Deploy backend to Azure Container Apps
        run: |
          az containerapp update \
            --name diranyai-api \
            --resource-group rg-diranyai-dev \
            --image diranyaicr.azurecr.io/diranyai-api:${{ github.sha }}